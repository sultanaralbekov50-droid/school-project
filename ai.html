<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-помощник | OPEN CAMPUS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #202622; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  
  .chat-container {
    width: 100%; max-width: 420px; background: #fff;
    border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; height: 650px; max-height: 90vh; overflow: hidden;
  }

  .chat-header {
    background: #344b3c; color: #fff; padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat-header h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .chat-header .close-btn {
    background: none; border: none; color: #fff; font-size: 20px;
    cursor: pointer; opacity: 0.8; transition: 0.2s;
  }
  .chat-header .close-btn:hover { opacity: 1; }

  .chat-messages {
    flex: 1; padding: 20px; overflow-y: auto; background: #fff;
    display: flex; flex-direction: column; gap: 16px;
  }

  .message-row { display: flex; align-items: flex-end; gap: 10px; }
  .message-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0;
    display: flex; justify-content: center; align-items: center; font-size: 16px; flex-shrink: 0;
  }
  .message-row.user .avatar { background: #344b3c; color: white; font-weight: bold; font-size: 14px; }

  .bubble {
    max-width: 75%; padding: 12px 16px; border-radius: 16px;
    font-size: 14px; line-height: 1.5; color: #1e293b;
  }
  .message-row.bot .bubble { background: #f1f5f9; border-bottom-left-radius: 4px; }
  .message-row.user .bubble { background: #344b3c; color: #fff; border-bottom-right-radius: 4px; }

  .chat-input-area {
    padding: 16px; background: #fff; border-top: 1px solid #e2e8f0;
    display: flex; gap: 10px;
  }
  .chat-input-area input {
    flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1;
    border-radius: 8px; outline: none; font-size: 14px; transition: 0.2s;
  }
  .chat-input-area input:focus { border-color: #344b3c; box-shadow: 0 0 0 3px rgba(199, 243, 107, 0.25); }
  
  .chat-input-area button {
    background: #344b3c; color: #fff; border: none; border-radius: 8px;
    padding: 0 20px; cursor: pointer; font-size: 18px; transition: 0.2s;
  }
  .chat-input-area button:hover { background: #263a2e; }

  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

  .chat-header { background: linear-gradient(135deg, #202622, #344b3c); }
  .chat-input-area button { background: #c7f36b; color: #202622; }
  .chat-input-area button:hover { background: #b5e65a; }
  .message-row.user .bubble { background: #344b3c; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>🤖 OPEN CAMPUS AI</h2>
    <button class="close-btn" onclick="window.close()">✕</button>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="message-row bot">
      <div class="avatar">🤖</div>
      <div class="bubble">Здравствуйте! Я ИИ-консультант OPEN CAMPUS. Помогу подобрать зал под ваши задачи. Спросите меня про вечеринки, учебу, спорт или просто напишите, сколько вас человек.</div>
    </div>
  </div>

  <div class="chat-input-area">
    <input type="text" id="chat-input" placeholder="Введите вопрос..." autocomplete="off">
    <button id="chat-send">➤</button>
  </div>
</div>

<script>
  const FAQ = [
    { 
      keys: ["вечерин", "праздн", "днюх", "тусов", "дискотек", "концерт", "день рожден"], 
      answer: "Для вечеринки или праздника лучше всего подойдет Актовый зал (до 50 человек). Там есть сцена, свет и хорошая звуковая система." 
    },
    { 
      keys: ["спорт", "физкультур", "трениров", "играть", "мяч", "зал для спорт"], 
      answer: "Для спортивных мероприятий и тренировок отлично подойдет спортивный зал. Он просторный, есть разметка и место для инвентаря." 
    },
    { 
      keys: ["учеб", "урок", "занят", "репетитор", "лекци", "семинар", "читать", "тихо"], 
      answer: "Для учебы, лекций или тихих занятий рекомендую Библиотеку или Читальный зал (до 15-20 человек). Там тихо, есть Wi-Fi и проектор." 
    },
    { 
      keys: ["цена", "стоимость", "сколько стоит", "прайс", "почём", "почем"], 
      answer: "Аренда Большого зала — 5000 сом/час, Библиотеки — 2000 сом/час. Точную стоимость можно посмотреть в карточке зала при бронировании." 
    },
    { 
      keys: ["оборудован", "проектор", "экран", "звук", "микрофон", "доска"], 
      answer: "В залах есть проектор, экран, Wi-Fi и звук. По запросу выдаем микрофон и флипчарт." 
    },
    { 
      keys: ["бронь", "забронировать", "резерв", "записаться"], 
      answer: "Забронировать помещение можно прямо на нашем сайте: выберите зал в каталоге и нажмите «Выбрать время»." 
    },
    {
      keys: ["привет", "здравств", "добрый", "хай"],
      answer: "Здравствуйте! 😊 Напишите, для какого мероприятия ищете зал и сколько вас человек, я подскажу лучший вариант."
    }
  ];

  const messagesContainer = document.getElementById('chat-messages');
  const inputField = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');

  function addMessage(text, sender) {
    const row = document.createElement('div');
    row.className = `message-row ${sender}`;
    
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = sender === 'user' ? 'Я' : '🤖';
    
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesContainer.appendChild(row);
    
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function getAnswer(text) {
    const lower = text.toLowerCase().trim();

    // Умный поиск по цифрам (например, "20 человек", "15 гостей")
    const numbers = lower.match(/\d+/g);
    if (numbers) {
      const count = parseInt(numbers[0], 10);
      if (count > 0 && count <= 15) {
        return "Для компании из " + count + " человек отлично подойдет Библиотека (до 15 мест). Там уютно и тихо.";
      } else if (count > 15 && count <= 50) {
        return "Для " + count + " человек рекомендую Актовый зал (до 50 мест). Там достаточно места и есть проектор.";
      } else if (count > 50) {
        return "Для " + count + " человек лучше всего подойдет Большой актовый зал (до 120 мест) в Лицее №61.";
      }
    }

    // Поиск по ключевым словам
    const found = FAQ.find(item => item.keys.some(k => lower.includes(k)));
    if (found) return found.answer;

    return "Извините, я пока не знаю ответа на этот вопрос. Спросите про залы, вечеринки, учебу, цены или оборудование.";
  }

  function handleSend() {
    const text = inputField.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    inputField.value = '';

    setTimeout(() => {
      const reply = getAnswer(text);
      addMessage(reply, 'bot');
    }, 500);
  }

  sendBtn.addEventListener('click', handleSend);
  inputField.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleSend();
  });
</script>

</body>
</html>
