<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-помощник</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f8fafc;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
  }

  #chat-widget {
    width: 100%; max-width: 400px; background: #fff;
    border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.12);
    overflow: hidden; display: flex; flex-direction: column;
    height: 600px; max-height: 90vh;
  }

  #chat-header {
    background: #2563eb; color: #fff; padding: 16px;
    font-weight: 600; font-size: 16px; display: flex;
    justify-content: space-between; align-items: center;
  }
  #chat-header small { font-weight: 400; opacity: .8; font-size: 12px; display: block; }

  #chat-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; background: #f8fafc;
  }

  .msg {
    padding: 10px 14px; border-radius: 14px; max-width: 85%;
    font-size: 14px; line-height: 1.45; word-wrap: break-word;
    animation: fadeIn .2s ease;
  }
  .user { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .bot  { background: #fff; color: #1e293b; align-self: flex-start;
          border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }

  #chat-input-area {
    display: flex; border-top: 1px solid #e2e8f0; background: #fff;
  }
  #chat-input {
    flex: 1; border: none; padding: 16px; outline: none; font-size: 14px;
  }
  #chat-send {
    border: none; background: #2563eb; color: #fff; padding: 0 20px;
    cursor: pointer; font-size: 18px; transition: background .15s;
  }
  #chat-send:hover { background: #1d4ed8; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  @media (max-width: 480px) {
    body { padding: 0; }
    #chat-widget { max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; }
  }
</style>
</head>
<body>

<div id="chat-widget">
  <div id="chat-header">
    <div>🤖 ИИ-помощник <small>Отвечу на ваши вопросы</small></div>
  </div>

  <div id="chat-messages">
    <div class="msg bot">Здравствуйте! 👋 Подскажу по залу и местам. Спросите, например: «какой у вас зал?», «где лучше сесть?», «сколько стоит?»</div>
  </div>

  <div id="chat-input-area">
    <input id="chat-input" placeholder="Ваш вопрос..." autocomplete="off" />
    <button id="chat-send" aria-label="Отправить">➤</button>
  </div>
</div>

<script>
/* ============================================================
   НАСТРОЙКА ОТВЕТОВ — меняйте под себя
   keys — слова-триггеры (ищем вхождение, регистр не важен)
   answer — что ответит помощник
   ============================================================ */
const FAQ = [
  {
    keys: ["зал", "помещение", "комната", "залы"],
    answer: "У нас два зала: большой (до 50 человек) — для мероприятий, и малый (до 15 человек) — для встреч и переговоров. Какой вам интереснее?"
  },
  {
    keys: ["место", "места", "сесть", "посадить", "рассадк", "где лучше"],
    answer: "Рекомендую места у окна — там светло и тихо. Если компанией — берите зону у сцены, оттуда всё видно. 👍"
  },
  {
    keys: ["цена", "стоимость", "сколько", "прайс", "почём", "почем"],
    answer: "Аренда большого зала — 5000 ₽/час, малого — 2000 ₽/час. Есть скидки при брони на весь день."
  },
  {
    keys: ["бронь", "забронировать", "резерв", "записаться"],
    answer: "Забронировать можно по телефону +7 999 123-45-67 или через форму на сайте. Бронь держим 24 часа."
  },
  {
    keys: ["контакт", "телефон", "связ", "позвонить", "адрес", "где вы"],
    answer: "Звоните: +7 999 123-45-67. Работаем ежедневно с 9:00 до 21:00. Адрес: г. Москва, ул. Примерная, 10."
  },
  {
    keys: ["привет", "здравств", "добрый", "хай", "hello"],
    answer: "Здравствуйте! 😊 Чем помочь? Могу рассказать про залы, места, цены и бронь."
  },
  {
    keys: ["спасибо", "благодар", "спс"],
    answer: "Пожалуйста! Если что-то ещё нужно — спрашивайте. 🙌"
  },
  {
    keys: ["пока", "до свидан", "bye"],
    answer: "До встречи! Будем рады видеть вас у нас. 👋"
  }
];

const FALLBACK = "Пока не понял вопрос 🙂 Спросите про зал, места, цены или бронь — с радостью подскажу.";

/* ============================================================
   ЛОГИКА ЧАТА — трогать не нужно
   ============================================================ */
const messagesBox = document.getElementById('chat-messages');
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('chat-send');

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  messagesBox.appendChild(div);
  messagesBox.scrollTop = messagesBox.scrollHeight;
}

function getAnswer(userText) {
  const lower = userText.toLowerCase().trim();
  const found = FAQ.find(item => item.keys.some(k => lower.includes(k)));
  return found ? found.answer : FALLBACK;
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  input.value = '';
  input.focus();

  // небольшая задержка "как будто думает"
  setTimeout(() => addMessage(getAnswer(text), 'bot'), 350);
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keypress', e => {
  if (e.key === 'Enter') sendMessage();
});
</script>

</body>
</html>
