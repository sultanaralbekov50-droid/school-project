<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Coworking AI</title>
<style>
  /* Стили под твой скриншот */
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  
  .chat-container {
    width: 100%; max-width: 420px; background: #fff;
    border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    display: flex; flex-direction: column; height: 650px; max-height: 90vh; overflow: hidden;
  }

  /* Шапка */
  .chat-header {
    background: #4F6BED; color: #fff; padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat-header h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .chat-header .close-btn {
    background: none; border: none; color: #fff; font-size: 20px;
    cursor: pointer; opacity: 0.8; transition: 0.2s;
  }
  .chat-header .close-btn:hover { opacity: 1; }

  /* Область сообщений */
  .chat-messages {
    flex: 1; padding: 20px; overflow-y: auto; background: #fff;
    display: flex; flex-direction: column; gap: 16px;
  }

  .message-row { display: flex; align-items: flex-end; gap: 10px; }
  .message-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0;
    display: flex; justify-content: center; align-items: center; font-size: 16px; flex-shrink: 0;
  }
  .message-row.user .avatar { background: #4F6BED; color: white; font-weight: bold; font-size: 14px; }

  .bubble {
    max-width: 75%; padding: 12px 16px; border-radius: 16px;
    font-size: 14px; line-height: 1.5; color: #1e293b;
  }
  .message-row.bot .bubble { background: #f1f5f9; border-bottom-left-radius: 4px; }
  .message-row.user .bubble { background: #4F6BED; color: #fff; border-bottom-right-radius: 4px; }

  /* Поле ввода */
  .chat-input-area {
    padding: 16px; background: #fff; border-top: 1px solid #e2e8f0;
    display: flex; gap: 10px;
  }
  .chat-input-area input {
    flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1;
    border-radius: 8px; outline: none; font-size: 14px; transition: 0.2s;
  }
  .chat-input-area input:focus { border-color: #4F6BED; box-shadow: 0 0 0 3px rgba(79, 107, 237, 0.2); }
  
  .chat-input-area button {
    background: #4F6BED; color: #fff; border: none; border-radius: 8px;
    padding: 0 20px; cursor: pointer; font-size: 18px; transition: 0.2s;
  }
  .chat-input-area button:hover { background: #3b52c4; }

  /* Скроллбар */
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>🤖 School Coworking AI</h2>
    <button class="close-btn" onclick="window.close()">✕</button>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="message-row bot">
      <div class="avatar">🤖</div>
      <div class="bubble">Здравствуйте! Я ИИ-консультант School Coworking. Помогу узнать цены, вместимость и оборудование помещений.</div>
    </div>
  </div>

  <div class="chat-input-area">
    <input type="text" id="chat-input" placeholder="Введите вопрос..." autocomplete="off">
    <button id="chat-send">➤</button>
  </div>
</div>

<script>
  // --- База знаний (твои ответы) ---
  const FAQ = [
    { 
      keys: ["зал", "помещение", "комната", "залы"], 
      answer: "У нас есть два зала: Большой (до 50 человек) и Малый (до 15 человек). Большой подходит для мероприятий, Малый — для переговоров и тихой работы." 
    },
    { 
      keys: ["место", "места", "сесть", "посадить", "где лучше", "окно", "сцена"], 
      answer: "Рекомендую места у окна — там светло и тихо. Если вы компанией — лучше занять зону ближе к сцене." 
    },
    { 
      keys: ["цена", "стоимость", "сколько", "прайс", "почём", "почем"], 
      answer: "Аренда Большого зала — 5000 ₽/час, Малого — 2000 ₽/час. При бронировании на весь день действует скидка." 
    },
    { 
      keys: ["оборудован", "проектор", "экран", "звук", "микрофон", "доска"], 
      answer: "В залах есть проектор, экран, Wi-Fi и звук. По запросу выдаем микрофон и флипчарт." 
    },
    { 
      keys: ["бронь", "забронировать", "резерв", "записаться"], 
      answer: "Забронировать помещение можно по телефону +7 999 123-45-67 или через форму на нашем сайте." 
    }
  ];

  const messagesContainer = document.getElementById('chat-messages');
  const inputField = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');

  // Функция добавления сообщения
  function addMessage(text, sender) {
    const row = document.createElement('div');
    row.className = `message-row ${sender}`;
    
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = sender === 'user' ? 'Я' : '🤖';
    
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesContainer.appendChild(row);
    
    // Автоскролл вниз
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  // Логика поиска ответа
  function getAnswer(text) {
    const lower = text.toLowerCase().trim();
    const found = FAQ.find(item => item.keys.some(k => lower.includes(k)));
    return found ? found.answer : "Извините, я пока не знаю ответа на этот вопрос. Спросите про залы, места, цены или оборудование.";
  }

  // Отправка
  function handleSend() {
    const text = inputField.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    inputField.value = '';

    // Имитация задержки (печатает...)
    setTimeout(() => {
      const reply = getAnswer(text);
      addMessage(reply, 'bot');
    }, 500);
  }

  // Слушатели событий
  sendBtn.addEventListener('click', handleSend);
  inputField.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleSend();
  });
</script>

</body>
</html>
