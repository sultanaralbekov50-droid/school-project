<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>School Coworking AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 0; }
  
  .chat-container {
    width: 100%; max-width: 420px; background: #fff;
    display: flex; flex-direction: column; height: 100vh; max-height: 100%; overflow: hidden;
  }

  .chat-header {
    background: #4F6BED; color: #fff; padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    padding-top: env(safe-area-inset-top, 16px); /* Отступ для айфонов */
  }
  .chat-header h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  
  .chat-header .close-btn {
    background: none; border: none; color: #fff; font-size: 24px;
    cursor: pointer; opacity: 0.8; transition: 0.2s; padding: 0 5px;
  }
  .chat-header .close-btn:hover { opacity: 1; }

  .chat-messages {
    flex: 1; padding: 20px; overflow-y: auto; background: #fff;
    display: flex; flex-direction: column; gap: 16px;
  }

  .message-row { display: flex; align-items: flex-end; gap: 10px; }
  .message-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0;
    display: flex; justify-content: center; align-items: center; font-size: 16px; flex-shrink: 0;
  }
  .message-row.user .avatar { background: #4F6BED; color: white; font-weight: bold; font-size: 14px; }

  .bubble {
    max-width: 80%; padding: 12px 16px; border-radius: 16px;
    font-size: 14px; line-height: 1.5; color: #1e293b;
  }
  .message-row.bot .bubble { background: #f1f5f9; border-bottom-left-radius: 4px; }
  .message-row.user .bubble { background: #4F6BED; color: #fff; border-bottom-right-radius: 4px; }

  .chat-input-area {
    padding: 16px; background: #fff; border-top: 1px solid #e2e8f0;
    display: flex; gap: 10px; padding-bottom: env(safe-area-inset-bottom, 16px);
  }
  .chat-input-area input {
    flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1;
    border-radius: 8px; outline: none; font-size: 16px; /* Защита от зума на iOS */
  }
  .chat-input-area input:focus { border-color: #4F6BED; box-shadow: 0 0 0 3px rgba(79, 107, 237, 0.2); }
  
  .chat-input-area button {
    background: #4F6BED; color: #fff; border: none; border-radius: 8px;
    padding: 0 20px; cursor: pointer; font-size: 18px; transition: 0.2s;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>🤖 School Coworking AI</h2>
    <button class="close-btn" onclick="window.parent.postMessage('close-chat', '*')">✕</button>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="message-row bot">
      <div class="avatar">🤖</div>
      <div class="bubble">Здравствуйте! Я ИИ-консультант School Coworking. Помогу подобрать зал. Спросите меня про вечеринки, учебу, спорт или просто напишите, сколько вас человек.</div>
    </div>
  </div>

  <div class="chat-input-area">
    <input type="text" id="chat-input" placeholder="Введите вопрос..." autocomplete="off">
    <button id="chat-send">➤</button>
  </div>
</div>
