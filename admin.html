<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Экран входа -->
<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 300px;">
        <h4 class="text-center mb-3">🔐 Вход</h4>
        <input type="password" id="pass" class="form-control mb-3" placeholder="Пароль (admin)">
        <button class="btn btn-primary w-100" onclick="login()">Войти</button>
    </div>
</div>

<!-- Панель -->
<div id="adminPanel" class="container mt-5 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👨‍💼 Админ-панель</h2>
        <a href="index.html" class="btn btn-outline-secondary">← На главную</a>
    </div>
    
    <button class="btn btn-warning mb-3" onclick="alert('Здесь будет таблица заявок на регистрацию')">🏫 Заявки на регистрацию школ</button>
    <button class="btn btn-success mb-3" onclick="alert('Здесь будет таблица бронирований')">📊 Заявки на брони</button>
    
    <div class="card shadow mt-3"><div class="card-body">
        <p class="text-muted text-center py-5">Здесь будет отображаться таблица с данными из Google Таблиц (когда мы их подключим).</p>
    </div></div>
</div>

<script>
    function login() {
        if (document.getElementById('pass').value === 'ara') {
            document.getElementById('loginScreen').classList.add('d-none');
            document.getElementById('adminPanel').classList.remove('d-none');
        } else {
            alert('Неверный пароль!');
        }
    }
</script>
</body>
</html>
