<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | Школьный Коворкинг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Экран входа -->
<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 300px;">
        <h4 class="text-center mb-3">🔐 Вход</h4>
        <input type="password" id="pass" class="form-control mb-3" placeholder="Введите пароль (admin)">
        <button class="btn btn-primary w-100" onclick="login()">Войти</button>
    </div>
</div>

<!-- Панель управления (скрыта) -->
<div id="adminPanel" class="container mt-5 d-none">
    <h2 class="mb-4">👨‍💼 Панель администратора</h2>
    <p class="text-muted">Здесь отображаются заявки. Данные подгружаются из базы автоматически.</p>
    
    <button class="btn btn-success mb-3" onclick="loadData()">🔄 Обновить данные</button>
    <a href="index.html" class="btn btn-secondary mb-3">← На главную</a>
    
    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Школа</th>
                        <th>Дата</th>
                        <th>Время</th>
                        <th>Зал</th>
                        <th>Клиент</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr><td colspan="5" class="text-center">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- СКРИПТ АДМИНКИ ---

    // 1. Авторизация
    function login() {
        const password = document.getElementById('pass').value;
        if (password === 'admin') { // Пароль для демо
            document.getElementById('loginScreen').classList.add('d-none');
            document.getElementById('adminPanel').classList.remove('d-none');
            loadData(); // Загружаем данные при входе
        } else {
            alert('Неверный пароль! (Подсказка: admin)');
        }
    }

    // 2. Загрузка данных из Google Sheets (Чтение)
    function loadData() {
        const tableBody = document.getElementById('adminTableBody');
        tableBody.innerHTML = '<tr><td colspan="5" class="text-center">Загрузка данных...</td></tr>';
        
        // ТВОЯ ССЫЛКА ИЗ GOOGLE APPS SCRIPT
        const url = "ВСТАВЬ_СЮДА_ССЫЛКУ_ИЗ_APPS_SCRIPT";

        fetch(url)
            .then(response => response.json())
            .then(data => {
                tableBody.innerHTML = ''; // Очищаем таблицу
                // Пропускаем первую строку (заголовки)
                for (let i = 1; i < data.length; i++) {
                    let row = data[i];
                    // row[0] = Дата, row[1] = Время, row[2] = Зал, row[3] = Клиент, row[4] = Школа
                    tableBody.innerHTML += `
                        <tr>
                            <td><span class="badge bg-primary">${row[4] || 'Не указана'}</span></td>
                            <td>${row[0]}</td>
                            <td>${row[1]}</td>
                            <td>${row[2]}</td>
                            <td>${row[3]}</td>
                        </tr>
                    `;
                }
                if (data.length <= 1) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="text-center">Заявок пока нет.</td></tr>';
                }
            })
            .catch(() => {
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Ошибка загрузки данных. Проверьте ссылку.</td></tr>';
            });
    }
</script>
</body>
</html>
