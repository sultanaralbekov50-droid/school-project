<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | Школьный Коворкинг</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Экран входа -->
<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 300px;">
        <h4 class="text-center mb-3">🔐 Вход</h4>
        <input type="password" id="pass" class="form-control mb-3" placeholder="Введите пароль (admin)">
        <button class="btn btn-primary w-100" onclick="login()">Войти</button>
    </div>
</div>

<!-- Панель управления (скрыта) -->
<div id="adminPanel" class="container mt-5 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👨‍💼 Панель администратора</h2>
        <a href="index.html" class="btn btn-outline-secondary">← На главную</a>
    </div>
    
    <p class="text-muted">Здесь отображаются все заявки. Данные подгружаются из базы автоматически.</p>
    
    <button class="btn btn-success mb-3" onclick="loadData()">🔄 Обновить данные</button>
    
    <div class="card shadow">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Школа</th>
                        <th>Дата</th>
                        <th>Время</th>
                        <th>Пространство</th>
                        <th>Клиент</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr><td colspan="5" class="text-center py-3">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- 1. АВТОРИЗАЦИЯ ---
    function login() {
        const password = document.getElementById('pass').value;
        if (password === 'admin') { 
            document.getElementById('loginScreen').classList.add('d-none');
            document.getElementById('adminPanel').classList.remove('d-none');
            loadData(); // Автоматически загружаем данные при входе
        } else {
            alert('Неверный пароль! (Подсказка: admin)');
        }
    }

    // --- 2. КРАСИВОЕ ФОРМАТИРОВАНИЕ ДАТЫ И ВРЕМЕНИ ---
    function formatDate(dateStr) {
        if (!dateStr) return "";
        if (dateStr.includes("T")) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('ru-RU'); // Возвращает 28.02.2026
        }
        return dateStr;
    }

    function formatTime(timeStr) {
        if (!timeStr) return "";
        if (timeStr.includes("T")) {
            const t = timeStr.split("T")[1].split(".")[0]; // Берем только часы:минуты
            return t; 
        }
        return timeStr;
    }

    // --- 3. ЗАГРУЗКА ДАННЫХ ИЗ GOOGLE SHEETS ---
    function loadData() {
        const tableBody = document.getElementById('adminTableBody');
        tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-3">Загрузка данных...</td></tr>';
        
        // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT
        const url = "https://script.google.com/macros/s/AKfyc.../exec";

        fetch(url)
            .then(response => response.json())
            .then(data => {
                tableBody.innerHTML = ''; 
                // Пропускаем первую строку (заголовки)
                for (let i = 1; i < data.length; i++) {
                    let row = data[i];
                    
                    // Оформление школы
                    let schoolBadge = row[4] ? `<span class="badge bg-primary">${row[4]}</span>` : `<span class="badge bg-secondary">Не указана</span>`;
                    
                    // Оформление даты и времени
                    let dateFormatted = formatDate(row[0]);
                    let timeFormatted = formatTime(row[1]);

                    tableBody.innerHTML += `
                        <tr>
                            <td>${schoolBadge}</td>
                            <td>${dateFormatted}</td>
                            <td>${timeFormatted}</td>
                            <td>${row[2]}</td>
                            <td>${row[3]}</td>
                        </tr>
                    `;
                }
                if (data.length <= 1) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="text-center py-3">Заявок пока нет.</td></tr>';
                }
            })
            .catch(() => {
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-3">Ошибка загрузки данных. Проверьте ссылку.</td></tr>';
            });
    }
</script>
</body>
</html>
