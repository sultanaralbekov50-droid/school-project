<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет директора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 350px;">
        <h4 class="text-center mb-3">🏫 Вход для директора</h4>
        <input type="text" id="loginInput" class="form-control mb-2" placeholder="Логин: school1">
        <input type="password" id="passwordInput" class="form-control mb-3" placeholder="Пароль: 12345">
        <button class="btn btn-primary w-100" onclick="login()">Войти</button>
        <a href="index.html" class="btn btn-link w-100 mt-2">На главную</a>
    </div>
</div>

<div id="dashboardScreen" class="container mt-5 d-none">
    <div class="d-flex justify-content-between mb-4">
        <h2>📊 Кабинет школы №1</h2>
        <button class="btn btn-outline-danger" onclick="location.reload()">Выйти</button>
    </div>
    
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5>🔗 Ваша ссылка для клиентов</h5>
            <div class="input-group mt-2">
                <input type="text" class="form-control" value="https://sultanalbekov50-droid.github.io/school-project/?school=Школа_1" readonly id="schoolLink">
                <button class="btn btn-primary" onclick="navigator.clipboard.writeText(document.getElementById('schoolLink').value); alert('Скопировано!')">Копировать</button>
            </div>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-header bg-dark text-white">Заявки</div>
        <div class="card-body">
            <table class="table">
                <thead><tr><th>Дата</th><th>Время</th><th>Зал</th><th>Клиент</th></tr></thead>
                <tbody>
                    <tr><td>20.11.2026</td><td>14:00</td><td>Актовый зал</td><td>Айбек (0555...)</td></tr>
                    <tr><td>21.11.2026</td><td>10:00</td><td>Библиотека</td><td>Мария (0700...)</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function login() {
        const log = document.getElementById('loginInput').value;
        const pass = document.getElementById('passwordInput').value;
        if (log === 'school1' && pass === '12345') {
            document.getElementById('loginScreen').classList.add('d-none');
            document.getElementById('dashboardScreen').classList.remove('d-none');
        } else {
            alert('Неверно! Логин: school1, Пароль: 12345');
        }
    }
</script>
</body>
</html>
