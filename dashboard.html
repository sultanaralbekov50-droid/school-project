<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кабинет директора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Форма входа -->
<div id="loginBox" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 350px;">
        <h4 class="text-center mb-3">🏫 Вход для директора</h4>
        <input type="text" id="login" class="form-control mb-2" placeholder="Логин">
        <input type="password" id="password" class="form-control mb-3" placeholder="Пароль">
        <button class="btn btn-primary w-100" onclick="alert('Здесь будет проверка логина и пароля из базы данных')">Войти</button>
        <a href="index.html" class="btn btn-link w-100 mt-2">На главную</a>
    </div>
</div>

</body>
</html>
